name: "Cleanup Actions Caches"

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    name: Prune old caches
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Delete caches older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -d '7 days ago' -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting caches last accessed before $CUTOFF"

          gh api "repos/$REPO/actions/caches" --paginate --jq \
            ".actions_caches[] | select(.last_accessed_at < \"$CUTOFF\") | .id" \
          | while read id; do
              echo "Deleting cache $id"
              gh api -X DELETE "repos/$REPO/actions/caches/$id" --silent
            done

          echo "Remaining caches:"
          gh api "repos/$REPO/actions/caches" --jq '{count: .total_count}'
