name: "Docker Build Proposal"

on:
  push:
    branches:
      - "proposal/**"

jobs:
  build:
    name: Build Docker Image (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract proposal suffix
        id: proposal
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SUFFIX="${BRANCH#proposal/}"
          SUFFIX="${SUFFIX//\//-}"
          if [ -z "$SUFFIX" ] || [ "$SUFFIX" = "$BRANCH" ]; then
            echo "Branch '$BRANCH' does not match proposal/<name> pattern" >&2
            exit 1
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:proposal-${{ steps.proposal.outputs.suffix }}
          cache-from: type=gha,scope=buildx-amd64
          cache-to: type=gha,mode=max,scope=buildx-amd64
